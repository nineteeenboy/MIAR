global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: social-api
  static_configs:
  - targets:
    - users-service:8000
    labels:
      service: users
  - targets:
    - content-service:8000
    labels:
      service: content
  - targets:
    - interaction-service:8000
    labels:
      service: interaction
  - targets:
    - community-service:8000
    labels:
      service: community
  - targets:
    - messenger-service:8000
    labels:
      service: messenger
  - targets:
    - moderation-service:8000
    labels:
      service: moderation
- job_name: postgres
  static_configs:
  - targets:
    - users-exporter:9187
    labels:
      database: users
  - targets:
    - interaction-exporter:9187
    labels:
      database: interaction
  - targets:
    - community-exporter:9187
    labels:
      database: community
  - targets:
    - moderation-exporter:9187
    labels:
      database: moderation
- job_name: mongodb
  static_configs:
  - targets:
    - content-exporter:9216
    labels:
      database: content
  - targets:
    - messenger-exporter:9216
    labels:
      database: messenger
